name: FareHunter Bundle deals-data.js

# Safety-net bundler. The scan workflow's `deploy` job already regenerates
# deals-data.js after a normal scheduled run. This workflow exists to catch the
# case that `deploy` misses: re-running only failed scan jobs from the GitHub UI
# does NOT re-run the already-succeeded `deploy` job, so deals found by re-run
# jobs would otherwise stay unbundled until the next 6AM/6PM scan.
#
# Runs daily at 8 AM UTC (commits only when deals-data.js actually changes) so
# a re-run / late scan commit reaches the dashboard the same morning.

on:
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read   # this public repo needs no write access

jobs:
  bundle:
    name: Regenerate deals-data.js → triggers Cloudflare auto-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private FareHunter repo
        uses: actions/checkout@v4
        with:
          repository: salnova-GmbH/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}
          ref: main

      - name: Generate deals-data.js from all route deals files
        working-directory: public-web
        shell: python
        run: |
          import json, pathlib, datetime
          from collections import defaultdict

          today = datetime.date.today().isoformat()
          DEALS_PER_GROUP = 20  # per (route, airline)

          deals_raw = []
          for f in sorted(pathlib.Path('../deals').glob('*.json')):
              try:
                  content = json.loads(f.read_text(encoding='utf-8'))
                  if isinstance(content, list):
                      deals_raw.extend(content)
              except Exception:
                  pass

          # 1. Filter past departures; deduplicate keeping most recent scan per combo
          seen = {}
          for d in deals_raw:
              if d.get('departure_date', '') < today:
                  continue
              key = (d.get('route', ''), d.get('airline', ''), d.get('departure_date', ''), d.get('return_date', ''))
              if key not in seen or d.get('timestamp', '') > seen[key].get('timestamp', ''):
                  seen[key] = d

          # 2. Group by (route, airline); keep best DEALS_PER_GROUP by deal quality
          def deal_sort_key(d):
              is_exc = 1 if d.get('deal') == 'EXCEPTIONAL DEAL' else 0
              baseline = d.get('baseline') or 1
              return (-is_exc, d.get('price', 999999) / baseline)

          groups = defaultdict(list)
          for d in seen.values():
              groups[(d.get('route', ''), d.get('airline', ''))].append(d)

          deals = []
          for entries in groups.values():
              entries.sort(key=deal_sort_key)
              deals.extend(entries[:DEALS_PER_GROUP])

          js = (
              '// Auto-generated by the deploy/bundle job — do not edit manually.\n'
              f'export const ALL_DEALS = {json.dumps(deals, separators=(",", ":"), ensure_ascii=False)};\n'
          )
          pathlib.Path('deals-data.js').write_text(js, encoding='utf-8')
          print(f'Bundled {len(deals_raw)} raw → {len(deals)} deals into deals-data.js')

          # ── ops-data.js: mirrors the deploy job (see scan.yml) ─────────────
          deals_per_route = {}
          for d in seen.values():
              r = d.get('route', '')
              deals_per_route[r] = deals_per_route.get(r, 0) + 1

          import re as _re
          route_names = sorted(
              n for n in (
                  {p.parent.name for p in pathlib.Path('../scans').glob('*/index.json')}
                  | {p.stem for p in pathlib.Path('../skips').glob('*.json')}
              )
              # exclude legacy per-airport tags (AMS, ZRH, …) from local scans
              if _re.fullmatch(r'[A-Z]{3}-[A-Z]{3}', n)
          )
          ops_routes = []
          for name in route_names:
              rec = {'route': name, 'last_scan': None, 'searched': None,
                     'failed': None, 'skipped': None,
                     'deals_count': deals_per_route.get(name, 0),
                     'tracked_buckets': 0, 'skippable_buckets': 0}
              try:
                  idx = json.loads(pathlib.Path(f'../scans/{name}/index.json').read_text(encoding='utf-8'))
                  last = idx[-1]
                  rec['last_scan'] = last.get('timestamp')
                  st = last.get('stats', {})
                  rec['searched'] = st.get('searched')
                  rec['failed'] = st.get('failed')
                  rec['skipped'] = st.get('skipped', 0)
              except Exception:
                  pass
              try:
                  sk = json.loads(pathlib.Path(f'../skips/{name}.json').read_text(encoding='utf-8'))
                  rec['tracked_buckets'] = len(sk)
                  rec['skippable_buckets'] = sum(1 for v in sk.values() if v.get('empty_streak', 0) >= 3)
              except Exception:
                  pass
              ops_routes.append(rec)

          ops = {
              'generated_at': max((r['last_scan'] for r in ops_routes if r['last_scan']), default=None),
              'routes': ops_routes,
          }
          pathlib.Path('ops-data.js').write_text(
              '// Auto-generated by the deploy/bundle job — do not edit manually.\n'
              f'export const OPS = {json.dumps(ops, separators=(",", ":"))};\n',
              encoding='utf-8')
          print(f'Ops summary: {len(ops_routes)} routes into ops-data.js')

      - name: Commit deals-data.js (Cloudflare auto-deploys on push)
        run: |
          git config user.name  "FareHunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-web/deals-data.js public-web/ops-data.js
          if git diff --staged --quiet; then
            echo "deals-data.js / ops-data.js unchanged — nothing to commit."
          else
            git commit -m "chore: bundle deals-data.js + ops-data.js $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in {1..6}; do
              git pull --rebase && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 15 + 5))
            done
          fi
