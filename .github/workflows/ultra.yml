name: FareHunter Ultra Scans

# Separate from scan.yml so it can be triggered manually without kicking off
# the 171-route scan matrix. Same daily cadence as before (was previously a
# job inside scan.yml that fired on every trigger of that workflow).

on:
  schedule:
    - cron: "0 10 * * *"   # 10 AM UTC every day — matches scan.yml's cadence
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read   # this public repo needs no write access

jobs:
  ultra:
    name: Ultra watch scans (dep ±2 × ret ±2)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: fare-hunter-ultra
      cancel-in-progress: false

    steps:
      - name: Checkout private FareHunter repo
        uses: actions/checkout@v4
        with:
          repository: FlorianSLZ/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}

      # Watches live in Cloudflare KV (created by Ultra users via the dashboard).
      # The worker exports them for CI; results go back via the import endpoint —
      # no git commit and no Cloudflare deploy involved. See ULTRA.md in FareHunter.
      - name: Fetch Ultra watches
        id: watches
        run: |
          echo "has_watches=false" >> "$GITHUB_OUTPUT"
          if [ -z "${{ secrets.ULTRA_SYNC_TOKEN }}" ]; then
            echo "ULTRA_SYNC_TOKEN not configured — skipping Ultra scan."
            exit 0
          fi
          status=$(curl -sS -o watches.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.ULTRA_SYNC_TOKEN }}" \
            https://farehunter.ch/api/ultra/export) || status=000
          if [ "$status" != "200" ]; then
            echo "Export endpoint returned HTTP $status — skipping Ultra scan."
            exit 0
          fi
          count=$(python3 -c "import json;d=json.load(open('watches.json'));print(sum(len(u.get('watches',[])) for u in d.get('users',[])))")
          echo "Found $count watch(es)."
          [ "$count" != "0" ] && echo "has_watches=true" >> "$GITHUB_OUTPUT" || true

      - name: Set up Python 3.12
        if: steps.watches.outputs.has_watches == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: steps.watches.outputs.has_watches == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        if: steps.watches.outputs.has_watches == 'true'
        run: playwright install chromium --with-deps

      - name: Scan Ultra watches
        if: steps.watches.outputs.has_watches == 'true'
        run: python main.py --watches watches.json

      - name: Upload results to worker KV
        if: steps.watches.outputs.has_watches == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.ULTRA_SYNC_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @ultra-results.json \
            https://farehunter.ch/api/ultra/results-import
          echo "Ultra results imported."

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-screenshots-ultra-${{ github.run_id }}
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7
