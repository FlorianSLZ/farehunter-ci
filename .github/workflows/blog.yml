name: FareHunter Weekly Blog Post

# Publishes the "Deal of the Week" blog post every Tuesday. Separate from
# scan.yml/ultra.yml (same reasoning as their split: triggering one must not
# kick off the others) — scheduled well after scan.yml's daily 1 AM UTC run,
# which takes ~2-3h, so deals/*.json is fresh by the time this runs.

on:
  schedule:
    - cron: "0 8 * * 2"   # Tuesdays, 08:00 UTC
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: farehunter-blog
  cancel-in-progress: false

permissions:
  contents: read   # this public repo needs no write access

jobs:
  publish:
    name: Generate & publish weekly deal post
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Needs deals/*.json (deal selection), src/content/blog/ (dedup state
      # + the post itself), the rest of src/ + root config (full Astro
      # build), scripts/ (generation logic), and public-web/ (build output +
      # the files Cloudflare doesn't build). Not data/, skips/, scans/ — the
      # multi-GB history this job never touches.
      - name: Checkout private FareHunter repo
        uses: actions/checkout@v4
        with:
          repository: salnova-GmbH/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            src/
            scripts/
            deals/
            public-web/
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Only the playwright *package* is needed (scraper.py imports
      # playwright.sync_api at module level so generate_blog_post.py can
      # reuse its build_search_url() classmethod) — no browser is ever
      # launched here, so skip the Chromium download/cache steps scan.yml
      # needs.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Select this week's deal
        run: python scripts/generate_blog_post.py

      - name: Check whether a new post was written
        id: check
        run: |
          if git status --porcelain src/content/blog | grep -q .; then
            echo "new_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_post=false" >> "$GITHUB_OUTPUT"
            echo "No eligible deal this week (all remaining destinations still in their 6-week cooldown, or no deals at all) — nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.new_post == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        if: steps.check.outputs.new_post == 'true'
        run: npm ci

      # public-web/dist/ is committed — Cloudflare serves it as-is and does
      # not build (see CLAUDE.md "Web app"), so the new post is invisible on
      # the live site until this runs and its output is committed below.
      - name: Build site
        if: steps.check.outputs.new_post == 'true'
        run: npm run build

      - name: Commit new post + rebuilt dist
        if: steps.check.outputs.new_post == 'true'
        run: |
          git config user.name  "FareHunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ public-web/dist/
          git commit -m "content: weekly deal post $(date -u +'%Y-%m-%d')"
          for i in {1..6}; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 15 + 5))
          done
