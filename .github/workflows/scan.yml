name: FareHunter Daily Scan

on:
  schedule:
    - cron: "0 6,18 * * *"   # 6 AM and 6 PM UTC every day
  workflow_dispatch:
    inputs:
      route:
        description: 'Route to scan, e.g. ZRH-JFK (empty = ALL)'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read   # this public repo needs no write access

jobs:
  scan:
    name: Scrape ${{ matrix.route }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: fare-hunter-scan-${{ matrix.route }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        route: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.route != '') && fromJSON(format('["{0}"]', github.event.inputs.route)) || fromJSON('["ZRH-JFK","ZRH-LAX","ZRH-SFO","ZRH-NRT","ZRH-HND","ZRH-SIN","ZRH-HKG","ZRH-BKK","ZRH-SEA","ZRH-BOG","ZRH-ICN","ZRH-JNB","ZRH-DXB","ZRH-DEL","FRA-JFK","FRA-LAX","FRA-SFO","FRA-NRT","FRA-HND","FRA-SIN","FRA-HKG","FRA-BKK","FRA-SEA","FRA-BOG","FRA-ICN","FRA-JNB","FRA-DXB","FRA-DEL","MXP-JFK","MXP-LAX","MXP-SFO","MXP-NRT","MXP-HND","MXP-SIN","MXP-HKG","MXP-BKK","MXP-SEA","MXP-BOG","MXP-ICN","MXP-JNB","MXP-DXB","MXP-DEL","VIE-JFK","VIE-LAX","VIE-SFO","VIE-NRT","VIE-HND","VIE-SIN","VIE-HKG","VIE-BKK","VIE-SEA","VIE-BOG","VIE-ICN","VIE-JNB","VIE-DXB","VIE-DEL","AMS-JFK","AMS-LAX","AMS-SFO","AMS-NRT","AMS-HND","AMS-SIN","AMS-HKG","AMS-BKK","AMS-SEA","AMS-BOG","AMS-ICN","AMS-JNB","AMS-DXB","AMS-DEL","MUC-JFK","MUC-LAX","MUC-SFO","MUC-NRT","MUC-HND","MUC-SIN","MUC-HKG","MUC-BKK","MUC-SEA","MUC-BOG","MUC-ICN","MUC-JNB","MUC-DXB","MUC-DEL","BUD-JFK","BUD-LAX","BUD-SFO","BUD-NRT","BUD-HND","BUD-SIN","BUD-HKG","BUD-BKK","BUD-SEA","BUD-BOG","BUD-ICN","BUD-JNB","BUD-DXB","BUD-DEL","MAD-JFK","MAD-LAX","MAD-SFO","MAD-NRT","MAD-HND","MAD-SIN","MAD-HKG","MAD-BKK","MAD-SEA","MAD-BOG","MAD-ICN","MAD-JNB","MAD-DXB","MAD-DEL","WAW-JFK","WAW-LAX","WAW-SFO","WAW-NRT","WAW-HND","WAW-SIN","WAW-HKG","WAW-BKK","WAW-SEA","WAW-BOG","WAW-ICN","WAW-JNB","WAW-DXB","WAW-DEL"]') }}

    steps:
      - name: Checkout private FareHunter repo
        uses: actions/checkout@v4
        with:
          repository: FlorianSLZ/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run FareHunter — ${{ matrix.route }}
        run: python main.py --route ${{ matrix.route }}

      - name: Write job summary
        if: always()
        shell: python
        run: |
          import json, os, pathlib

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_file:
              raise SystemExit(0)

          route = "${{ matrix.route }}"
          try:
              deals = json.loads(pathlib.Path(f"deals-{route}.json").read_text(encoding="utf-8"))
          except Exception:
              deals = []

          lines = [f"## FareHunter — {route}\n"]
          if deals:
              lines.append(f"### {len(deals)} deal(s) detected\n")
              for d in deals:
                  icon = "🔥" if d["deal"] == "EXCEPTIONAL DEAL" else "✅"
                  dep = d.get("departure_date", "")
                  ret = d.get("return_date", "")
                  date_range = f"{dep} → {ret}" if ret else dep
                  lines.append(
                      f"{icon} **{d['origin']} → {d['destination']}** ({date_range}) — "
                      f"${d['price']:,.0f} vs ${d['baseline']:,.0f} baseline "
                      f"({d['deal']}) — {d['airline']}"
                  )
          else:
              lines.append("No deals detected this run.")

          with open(summary_file, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

      - name: Upload deals artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deals-${{ matrix.route }}-${{ github.run_id }}
          path: deals-${{ matrix.route }}.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-screenshots-${{ matrix.route }}-${{ github.run_id }}
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Copy deals to public-web
        if: always()
        run: |
          if [ -f deals/${{ matrix.route }}.json ]; then
            cp deals/${{ matrix.route }}.json public-web/deals-${{ matrix.route }}.json
          fi

      - name: Commit results back to FareHunter
        if: always()
        run: |
          git config user.name  "FareHunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/${{ matrix.route }}.json ]               && git add data/${{ matrix.route }}.json
          [ -f deals/${{ matrix.route }}.json ]              && git add deals/${{ matrix.route }}.json
          [ -f public-web/deals-${{ matrix.route }}.json ]   && git add public-web/deals-${{ matrix.route }}.json
          [ -d scans ]                                        && git add scans/
          if git diff --staged --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "chore: scan ${{ matrix.route }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in {1..6}; do
              git pull --rebase && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 15 + 5))
            done
          fi

  deploy:
    name: Bundle deals-data.js → triggers Cloudflare auto-deploy
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private FareHunter repo
        uses: actions/checkout@v4
        with:
          repository: FlorianSLZ/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}
          ref: main

      - name: Generate deals-data.js from all route deals files
        working-directory: public-web
        shell: python
        run: |
          import json, pathlib

          deals = []
          for f in sorted(pathlib.Path('../deals').glob('*.json')):
              try:
                  content = json.loads(f.read_text(encoding='utf-8'))
                  if isinstance(content, list):
                      deals.extend(content)
              except Exception:
                  pass

          js = (
              '// Auto-generated by the deploy job — do not edit manually.\n'
              f'export const ALL_DEALS = {json.dumps(deals, indent=2)};\n'
          )
          pathlib.Path('deals-data.js').write_text(js, encoding='utf-8')
          print(f'Bundled {len(deals)} deals into deals-data.js')

      - name: Commit deals-data.js (Cloudflare auto-deploys on push)
        run: |
          git config user.name  "FareHunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-web/deals-data.js
          if git diff --staged --quiet; then
            echo "deals-data.js unchanged — nothing to commit."
          else
            git commit -m "chore: update deals-data.js $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase && git push
          fi

